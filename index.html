<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plery Online</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#07100d">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <main id="game-shell">
    <div id="crosshair" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <button id="leave-button" class="neon-button" type="button">Leave server</button>
    <canvas id="avatar-2d" width="64" height="128" aria-label="Player avatar"></canvas>
    <section id="chat-panel" aria-label="Online chat">
      <div id="chat-title">ONLINE CHAT</div>
      <div id="chat-messages"></div>
      <input id="chat-input" type="text" maxlength="120" autocomplete="off" placeholder="Press T to chat...">
    </section>
    <section id="intro-panel">
      <div id="menu-view">
        <p class="eyebrow">Plery Online</p>
        <button id="start-button" class="neon-button" type="button">Join server</button>
      </div>
      <div id="server-browser" hidden>
        <div class="browser-heading">
          <div>
            <p class="eyebrow">Multiplayer</p>
            <h2>Server browser</h2>
          </div>
          <button id="back-button" class="text-button" type="button">Back</button>
        </div>
        <div class="server-panel">
          <label for="server-player-name">Player name</label>
          <div class="name-tools">
            <input id="server-player-name" type="text" maxlength="16" autocomplete="off" placeholder="Player name">
            <button id="change-player-name-button" class="neon-button" type="button">Change</button>
          </div>
          <label for="room-name-input">Server name</label>
          <div class="room-tools">
            <input id="room-name-input" type="text" maxlength="24" autocomplete="off" placeholder="Server name">
            <button id="change-server-name-button" class="neon-button" type="button">Change</button>
            <button id="host-button" class="neon-button" type="button">Create server</button>
          </div>
          <div class="server-stats"><span>KILLS <strong id="server-kills">0</strong></span><span>LEVEL <strong id="server-level">1</strong></span></div>
        </div>
        <div class="server-list-heading">
          <span>Open servers</span>
          <button id="refresh-rooms-button" class="text-button" type="button">Refresh</button>
        </div>
        <div id="room-list" aria-live="polite"></div>
      </div>
      <div id="server-status" aria-live="polite"></div>
    </section>
  </main>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"
      }
    }
  </script>
  <script src="server-config.js"></script>
  <script type="module" src="game.js?v=83"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js?v=5');
  </script>
</body>
</html>
